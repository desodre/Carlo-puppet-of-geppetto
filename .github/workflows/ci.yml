name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Pinned Rust toolchain
        run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - run: python3 -m compileall -q tools

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned NDK
        shell: bash
        run: |
          ndk_version=$(python3 -c 'import json; print(json.load(open("android-build.json"))["ndk_version"])')
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk_version"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk_version" >> "$GITHUB_ENV"
      - name: Check Android-specific Rust paths
        run: |
          cargo clippy --locked --all-targets --target x86_64-linux-android -- -D warnings
          cargo clippy --locked --all-targets --target aarch64-linux-android -- -D warnings
      - name: Build and verify both Android ABIs
        run: python3 tools/build_android.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: carlo-android-native
          path: dist/
          if-no-files-found: error

